# Desenvolvimento (so o banco):  docker compose up -d db   +   mvn spring-boot:run
# Tudo em containers:            docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyplanner
      POSTGRES_USER: ${DB_USER:-studyplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studyplanner}
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studyplanner} -d studyplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/studyplanner
      DB_USER: ${DB_USER:-studyplanner}
      DB_PASSWORD: ${DB_PASSWORD:-studyplanner}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # use true quando servir por HTTPS (atras de um proxy com TLS)
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"

volumes:
  dados:
