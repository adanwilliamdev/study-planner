# Perfil de producao: SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studyplanner}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:studyplanner}
spring.datasource.password=${DB_PASSWORD}

# O esquema e controlado pelas migracoes do Flyway; o Hibernate apenas valida
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Sem valor padrao: a aplicacao nao sobe sem um segredo definido (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}

# Atras de proxy reverso: usa X-Forwarded-For (IP real no limite de tentativas de login)
server.forward-headers-strategy=framework

# Swagger desligado por padrao em producao
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
