# Servidor
server.port=8080

# Banco de dados (H2 em memoria para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:studyplanner;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
# Defina JWT_SECRET no ambiente (minimo 32 caracteres). O valor padrao serve
# apenas para desenvolvimento local e NAO deve ser usado em producao.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-ms=86400000

# CORS (origens separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
