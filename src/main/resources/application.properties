spring.application.name=study-planner
spring.profiles.default=dev
server.port=${PORT:8080}
server.compression.enabled=true

# Banco: o esquema e criado e versionado pelo Flyway; o Hibernate so valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Sessao e cookies
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Agendador (alertas de prazo + timers do Pomodoro usam o mesmo pool)
spring.task.scheduling.pool.size=4

# Fuso usado para "hoje", prazos e agendamentos
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

vaadin.launch-browser=false
